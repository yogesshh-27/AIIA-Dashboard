<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="100%" height="100%">
  <!-- State Emblem of India (Ashoka Lion Capital) -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Central Lion (Front) -->
  <g fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round">
    <!-- Head & Mane -->
    <path d="M 100 20 C 85 20, 80 35, 78 48 C 76 58, 80 68, 84 75 C 80 82, 75 92, 76 102 C 77 114, 85 125, 100 128 C 115 125, 123 114, 124 102 C 125 92, 120 82, 116 75 C 120 68, 124 58, 122 48 C 120 35, 115 20, 100 20 Z" />
    
    <!-- Ears -->
    <path d="M 78 28 C 72 26, 68 34, 73 40 C 76 40, 77 36, 78 28 Z" />
    <path d="M 122 28 C 128 26, 132 34, 127 40 C 124 40, 123 36, 122 28 Z" />
    
    <!-- Facial Features -->
    <!-- Eyes -->
    <ellipse cx="91" cy="46" rx="4" ry="2.5" fill="#451a03" />
    <ellipse cx="109" cy="46" rx="4" ry="2.5" fill="#451a03" />
    <!-- Brow/Snout -->
    <path d="M 88 42 C 94 40, 106 40, 112 42 C 108 45, 104 52, 104 58 L 96 58 C 96 52, 92 45, 88 42 Z" fill="url(#bronzeGrad)" />
    <!-- Nose -->
    <path d="M 96 58 L 104 58 L 100 64 Z" fill="#451a03" />
    <!-- Whiskers/Mouth -->
    <path d="M 92 65 C 96 68, 100 68, 100 65 C 100 68, 104 68, 108 65 C 104 72, 96 72, 92 65 Z" fill="#78350f" />
    <!-- Teeth/Chin -->
    <path d="M 97 70 L 103 70 L 100 74 Z" fill="#ffffff" />
    
    <!-- Left Lion (Profile) -->
    <path d="M 76 35 C 65 35, 52 45, 48 60 C 44 75, 48 90, 54 100 C 60 110, 70 118, 78 122 C 73 112, 70 98, 72 85 C 73 75, 75 60, 76 35 Z" />
    <path d="M 52 50 C 46 48, 42 54, 46 60 Z" />
    <ellipse cx="56" cy="58" rx="3" ry="2" fill="#451a03" />
    <path d="M 47 68 C 50 72, 56 72, 58 68 Z" fill="#78350f" />

    <!-- Right Lion (Profile) -->
    <path d="M 124 35 C 135 35, 148 45, 152 60 C 156 75, 152 90, 146 100 C 140 110, 130 118, 122 122 C 127 112, 130 98, 128 85 C 127 75, 125 60, 124 35 Z" />
    <path d="M 148 50 C 154 48, 158 54, 154 60 Z" />
    <ellipse cx="144" cy="58" rx="3" ry="2" fill="#451a03" />
    <path d="M 153 68 C 150 72, 144 72, 142 68 Z" fill="#78350f" />
    
    <!-- Chest / Torso & Mane curls -->
    <path d="M 78 122 C 78 135, 88 145, 100 148 C 112 145, 122 135, 122 122 Z" />
    <!-- Decorative Mane Details -->
    <path d="M 85 85 C 80 95, 88 105, 94 112" fill="none" stroke="#78350f" stroke-width="1.5" />
    <path d="M 115 85 C 120 95, 112 105, 106 112" fill="none" stroke="#78350f" stroke-width="1.5" />
    <path d="M 100 80 L 100 120" fill="none" stroke="#78350f" stroke-width="1.5" />
  </g>

  <!-- Abacus / Capital Base Platform -->
  <g fill="url(#bronzeGrad)" stroke="#451a03" stroke-width="1.5">
    <path d="M 30 150 L 170 150 L 165 185 L 35 185 Z" />
    <rect x="25" y="185" width="150" height="8" rx="2" fill="url(#goldGrad)" />
  </g>

  <!-- Ashoka Chakra (Dharma Chakra) in Center of Abacus -->
  <g transform="translate(100, 167)">
    <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#1e3a8a" />
    <!-- 24 Spokes Representation -->
    <path d="M 0 -14 L 0 14 M -14 0 L 14 0 M -10 -10 L 10 10 M -10 10 L 10 -10 M -5 -13 L 5 13 M -13 -5 L 13 5 M -5 13 L 5 -13 M -13 5 L 13 -5" stroke="#1e3a8a" stroke-width="1" />
  </g>

  <!-- Galloping Horse (Left of Chakra) -->
  <path d="M 52 165 C 55 160, 60 160, 65 163 C 68 165, 72 163, 75 160 C 72 166, 68 170, 64 170 C 60 170, 56 173, 52 175 L 50 170 C 53 168, 51 166, 52 165 Z" fill="#fef3c7" stroke="#78350f" stroke-width="1" />

  <!-- Bull (Right of Chakra) -->
  <path d="M 148 165 C 145 161, 140 162, 136 164 C 132 166, 128 164, 125 162 C 128 167, 132 170, 136 170 C 140 170, 144 173, 148 174 L 150 169 C 147 167, 149 166, 148 165 Z" fill="#fef3c7" stroke="#78350f" stroke-width="1" />

  <!-- Inverted Bell Lotus Foundation -->
  <g fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5">
    <path d="M 38 193 C 45 220, 65 230, 100 230 C 135 230, 155 220, 162 193 Z" />
    <!-- Lotus Petals -->
    <path d="M 50 193 C 58 215, 75 225, 100 225 C 125 225, 142 215, 150 193" fill="none" stroke="#78350f" stroke-width="1.5" />
    <path d="M 70 193 C 78 210, 88 220, 100 220 C 112 220, 122 210, 130 193" fill="none" stroke="#78350f" stroke-width="1.5" />
    <path d="M 90 193 C 94 205, 96 215, 100 215 C 104 215, 106 205, 110 193" fill="none" stroke="#78350f" stroke-width="1.5" />
  </g>

  <!-- Motto Banner: "सत्यमेव जयते" (Satyameva Jayate) -->
  <g transform="translate(100, 260)">
    <rect x="-80" y="-14" width="160" height="24" rx="4" fill="#fef3c7" stroke="#78350f" stroke-width="1.5" />
    <text x="0" y="4" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="12" fill="#78350f" text-anchor="middle" letter-spacing="1">
      सत्यमेव जयते
    </text>
  </g>
</svg>
