<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none" role="img" aria-label="All India Institute of Ayurveda (AIIA) Emblem">
  <defs>
    <!-- Rich Golden and Emerald Gradients -->
    <linearGradient id="aiiaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <linearGradient id="aiiaGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>

    <linearGradient id="aiiaHerbGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>

    <filter id="aiiaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3" flood-color="#022c22"/>
    </filter>
  </defs>

  <!-- Base Circle with Drop Shadow -->
  <g filter="url(#aiiaShadow)">
    <!-- Outer Golden Ring -->
    <circle cx="80" cy="80" r="76" fill="url(#aiiaGoldGrad)"/>
    <circle cx="80" cy="80" r="72" fill="#064E3B" stroke="url(#aiiaGoldGrad)" stroke-width="2"/>

    <!-- Concentric Decorative Dot Ring -->
    <circle cx="80" cy="80" r="69" stroke="#FDE047" stroke-width="0.8" stroke-dasharray="2 3" fill="none"/>

    <!-- Inner Emerald Field -->
    <circle cx="80" cy="80" r="54" fill="url(#aiiaGreenGrad)" stroke="url(#aiiaGoldGrad)" stroke-width="1.8"/>
  </g>

  <!-- Circular Text Inscriptions along Ring Paths -->
  <defs>
    <!-- Top Arc Path for Devanagari text -->
    <path id="topArcPath" d="M 22,80 A 58,58 0 1,1 138,80" fill="none"/>
    <!-- Bottom Arc Path for English text -->
    <path id="bottomArcPath" d="M 140,80 A 60,60 0 0,1 20,80" fill="none"/>
  </defs>

  <!-- Top Inscription: अख़िल भारतीय आयुर्वेद संस्थान -->
  <text font-family="'Mukta', 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-weight="700" font-size="8.5" fill="#FEF08A">
    <textPath href="#topArcPath" startOffset="50%" text-anchor="middle">
      अखिल भारतीय आयुर्वेद संस्थान
    </textPath>
  </text>

  <!-- Bottom Inscription: ALL INDIA INSTITUTE OF AYURVEDA -->
  <text font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="6.8" fill="#FDE047" letter-spacing="0.6">
    <textPath href="#bottomArcPath" startOffset="50%" text-anchor="middle">
      • ALL INDIA INSTITUTE OF AYURVEDA •
    </textPath>
  </text>

  <!-- Central Crest Motif: Amrita Kalasha (Vessel of Immortality/Ayurveda), Foliage & Sun -->
  <g id="central-symbol" transform="translate(80, 82)">
    <!-- Radiant Aura / Sunbeams behind Kalasha -->
    <g opacity="0.4" stroke="#FDE047" stroke-width="1" stroke-linecap="round">
      <line x1="0" y1="-32" x2="0" y2="-26"/>
      <line x1="-12" y1="-30" x2="-8" y2="-25"/>
      <line x1="12" y1="-30" x2="8" y2="-25"/>
      <line x1="-22" y1="-22" x2="-16" y2="-18"/>
      <line x1="22" y1="-22" x2="16" y2="-18"/>
    </g>

    <!-- Flanking Herbal Branches (Ayurvedic Tulsi / Neem leaves) -->
    <!-- Left Branch -->
    <path d="M -8,14 C -18,12 -28,-2 -26,-18 C -22,-12 -16,-4 -6,4" fill="url(#aiiaHerbGrad)" opacity="0.9"/>
    <path d="M -14,-4 C -24,-6 -30,-14 -30,-22 C -24,-18 -18,-14 -12,-8" fill="url(#aiiaHerbGrad)" opacity="0.85"/>
    <path d="M -10,-14 C -16,-20 -20,-28 -18,-32 C -14,-28 -10,-22 -8,-16" fill="url(#aiiaHerbGrad)" opacity="0.8"/>

    <!-- Right Branch (Mirrored) -->
    <path d="M 8,14 C 18,12 28,-2 26,-18 C 22,-12 16,-4 6,4" fill="url(#aiiaHerbGrad)" opacity="0.9"/>
    <path d="M 14,-4 C 24,-6 30,-14 30,-22 C 24,-18 18,-14 12,-8" fill="url(#aiiaHerbGrad)" opacity="0.85"/>
    <path d="M 10,-14 C 16,-20 20,-28 18,-32 C 14,-28 10,-22 8,-16" fill="url(#aiiaHerbGrad)" opacity="0.8"/>

    <!-- Sacred Kalasha (Ayurvedic Urn of Healing) -->
    <!-- Pedestal / Base -->
    <ellipse cx="0" cy="18" rx="14" ry="3.5" fill="url(#aiiaGoldGrad)"/>
    <path d="M -9,18 L -6,13 L 6,13 L 9,18 Z" fill="url(#aiiaGoldGrad)"/>

    <!-- Pot Body -->
    <path d="M -16,6 C -18,14 -10,16 0,16 C 10,16 18,14 16,6 C 16,-3 12,-6 8,-6 L -8,-6 C -12,-6 -16,-3 -16,6 Z" fill="url(#aiiaGoldGrad)"/>

    <!-- Neck & Rim -->
    <rect x="-7" y="-9" width="14" height="4" rx="1.5" fill="url(#aiiaGoldGrad)"/>
    <ellipse cx="0" cy="-9" rx="8" ry="2" fill="#FEF08A"/>

    <!-- Mango Leaves on top of Kalasha -->
    <path d="M 0,-9 C -6,-16 -12,-18 -14,-22 C -8,-20 -4,-16 0,-9 Z" fill="#22C55E"/>
    <path d="M 0,-9 C 6,-16 12,-18 14,-22 C 8,-20 4,-16 0,-9 Z" fill="#22C55E"/>
    <path d="M 0,-9 C -3,-18 -4,-26 0,-28 C 4,-26 3,-18 0,-9 Z" fill="#4ADE80"/>

    <!-- Coconut / Amrita Sphere -->
    <ellipse cx="0" cy="-11" rx="5" ry="5.5" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>

    <!-- Glowing Healing Core / Diamond -->
    <polygon points="0,-1 4,5 0,11 -4,5" fill="#FFFBEB" opacity="0.95"/>
    <circle cx="0" cy="5" r="2" fill="#B45309"/>

    <!-- Sanskrit Motto Banner / Ribbon at base: "सर्वभूतहितैषिणी" -->
    <g transform="translate(0, 24)">
      <path d="M -32,-3 L -24,4 L -28,8 L -20,7 C -10,9 10,9 20,7 L 28,8 L 24,4 L 32,-3 C 18,1 -18,1 -32,-3 Z" fill="url(#aiiaGoldGrad)"/>
      <path d="M -22,4 C -10,6 10,6 22,4 L 20,0 C 10,2 -10,2 -20,0 Z" fill="#FEF08A"/>
      <text x="0" y="3.5" font-family="'Mukta', 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-weight="800" font-size="4.8" fill="#1E293B" text-anchor="middle">
        सर्वभूतहितैषिणी
      </text>
    </g>
  </g>
</svg>
