##############################################################
# Render Blueprint — AIIA AYURCTMS FastAPI Backend
# Docs: https://docs.render.com/blueprint-spec
##############################################################
services:
  - type: web
    name: aiia-dashboard-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app_fastapi:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: "10000"
    healthCheckPath: /api/ayur/dashboard/stats
    autoDeploy: true
